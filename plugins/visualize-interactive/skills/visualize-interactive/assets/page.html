// Light or dark follows the system (or the host page) until the button overrides it; switching back to match follows again.
(() => {
  const root = document.documentElement, host = root.getAttribute("data-theme"), dark = matchMedia("(prefers-color-scheme: dark)"), KEY = "happyface-theme", b = document.getElementById("theme");
  const base = () => host || (dark.matches ? "dark" : "light"), now = () => root.getAttribute("data-theme") || base();
  const paint = () => { const to = now() === "dark" ? "light" : "dark"; b.setAttribute("aria-label", "Switch to " + to + " mode"); b.title = "Switch to " + to + " mode"; b.innerHTML = to === "light" ? '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>' : '<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M20.5 14.2A8.6 8.6 0 0 1 9.8 3.5a8.7 8.7 0 1 0 10.7 10.7z"/></svg>'; };
  try { const t = localStorage.getItem(KEY); if (t === "light" || t === "dark") root.setAttribute("data-theme", t); } catch (e) {}
  b.addEventListener("click", () => {
    const to = now() === "dark" ? "light" : "dark", follow = to === base();
    if (!follow) root.setAttribute("data-theme", to); else if (host) root.setAttribute("data-theme", host); else root.removeAttribute("data-theme");
    try { if (follow) localStorage.removeItem(KEY); else localStorage.setItem(KEY, to); } catch (e) {}
    paint();
  });
  dark.addEventListener("change", paint);
  paint();
})();
</script>
