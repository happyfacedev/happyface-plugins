<style>
/* Layout: one decision per screen. Question on top, options side by side as large selectable pictures sharing row lines, controls pinned below. */
:root {
  --bg: #fbfcfe; --card: #ffffff; --sunk: #eef1f6; --ink: #0b1220; --muted: #4f5a6b; --line: #cbd2dd;
  --accent: #1f4fd1; --accent-ink: #ffffff; --accent-bg: #e9effd; --rec: #0b6b4f; --rec-bg: #e2f3ec;
  --warn: #8f4a00; --warn-bg: #fdeed8; --bad: #a3231a; --focus: #d98a00;
  --term-bg: #101722; --term-ink: #dfe6ee; --term-muted: #93a0b0; --term-cmd: #9fd0ff; --term-err: #ff9b8f; --term-hi: #3a3215; --term-hi-ink: #ffe08a;
  --add-bg: #e0f3e7; --add: #0c5a2c; --del-bg: #fae3e3; --del: #8f1d1d; --hi-bg: #fff1bf;
  --f: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --m: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1117; --card: #131922; --sunk: #1b222d; --ink: #eef1f5; --muted: #a9b3c1; --line: #394452;
  --accent: #8aa8ff; --accent-ink: #0d1117; --accent-bg: #18233f; --rec: #63d6a8; --rec-bg: #133126;
  --warn: #f3ad5b; --warn-bg: #38280f; --bad: #ff9b8f; --focus: #ffbf47;
  --term-bg: #070a0f; --add-bg: #12351f; --add: #8be0a8; --del-bg: #3d1717; --del: #ffaaa3; --hi-bg: #3d3412; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d1117; --card: #131922; --sunk: #1b222d; --ink: #eef1f5; --muted: #a9b3c1; --line: #394452;
  --accent: #8aa8ff; --accent-ink: #0d1117; --accent-bg: #18233f; --rec: #63d6a8; --rec-bg: #133126;
  --warn: #f3ad5b; --warn-bg: #38280f; --bad: #ff9b8f; --focus: #ffbf47;
  --term-bg: #070a0f; --add-bg: #12351f; --add: #8be0a8; --del-bg: #3d1717; --del: #ffaaa3; --hi-bg: #3d3412; color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 1rem/1.45 var(--f); }
button, textarea { font: inherit; color: inherit; }
.app { min-height: 100%; max-width: 72rem; margin: 0 auto; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.link { background: none; border: 0; padding: 0.5rem 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 0.2em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

.top { display: flex; align-items: center; gap: 1rem; padding-block: 0.75rem; min-height: 3.25rem; }
.where { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { flex: 0 1 10rem; height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }

main { flex: 1; padding-block: 0.5rem 1rem; min-width: 0; }
main:focus { outline: none; }
h1 { font-size: clamp(1.5rem, 3.2vw, 2rem); line-height: 1.2; margin: 0; text-wrap: balance; }
.intro { margin: 0 0 0.9rem; max-width: 65ch; }
.why { margin: 0.4rem 0 0; color: var(--muted); font-size: 1.0625rem; max-width: 65ch; }
.cap { margin: 0.3rem 0 0; font-size: 0.9375rem; }
.ref, .ft { display: block; font-size: 0.8125rem; color: var(--muted); margin: 0.4rem 0 0; }

.options { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); grid-template-rows: repeat(4, auto); gap: 0 1rem; border: 0; padding: 0; margin: 1.1rem 0 0; min-width: 0; }
.opt { position: relative; display: grid; grid-row: span 4; grid-template-rows: subgrid; min-width: 0; border: 2px solid var(--line); border-radius: 10px; background: var(--card); cursor: pointer; overflow: hidden; }
.opt:hover { border-color: var(--muted); }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-bg); box-shadow: 0 0 0 1px var(--accent); }
.opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.1rem 0.65rem; padding: 0.85rem 1rem 0.7rem; align-content: start; }
.key { grid-row: span 2; width: 1.7rem; height: 1.7rem; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 6px; font: 500 0.875rem var(--m); color: var(--muted); }
.opt:has(input:checked) .key { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.name { font-weight: 700; font-size: 1.125rem; line-height: 1.3; }
.does { color: var(--muted); font-size: 0.9375rem; }
.pic { padding: 0 1rem 0.75rem; min-width: 0; }
.src { display: block; font-size: 0.8125rem; color: var(--muted); padding-top: 0.35rem; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.15rem 0.75rem; margin: 0; padding: 0.7rem 1rem; border-top: 1px solid var(--line); font-size: 0.9375rem; align-content: start; }
.facts.none:empty { padding: 0; border: 0; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; }
.facts .perm { grid-column: 1 / -1; color: var(--bad); font-weight: 700; }
.rec { font-size: 0.9375rem; } .rec.on { padding: 0.65rem 1rem; background: var(--rec-bg); } .rec b { color: var(--rec); }

.term, .file { border-radius: 7px; font: 0.8125rem/1.55 var(--m); overflow-x: auto; }
.term { background: var(--term-bg); color: var(--term-ink); padding: 0.65rem 0.75rem; }
.ln { white-space: pre-wrap; overflow-wrap: anywhere; padding-inline: 0.3rem; border-radius: 3px; }
.term .cmd { color: var(--term-cmd); } .term .err { color: var(--term-err); } .term .muted, .term .exit { color: var(--term-muted); } .term .hi { background: var(--term-hi); color: var(--term-hi-ink); }
.term .exit { padding: 0.35rem 0.3rem 0; font-size: 0.75rem; } .term .exit.bad { color: var(--term-err); }
.file { border: 1px solid var(--line); background: var(--card); }
.fname { background: var(--sunk); color: var(--muted); padding: 0.3rem 0.65rem; font-size: 0.75rem; overflow-wrap: anywhere; }
.file .body { padding: 0.35rem; } .file .muted { color: var(--muted); } .file .hi { background: var(--hi-bg); }
.file .add { background: var(--add-bg); color: var(--add); } .file .del { background: var(--del-bg); color: var(--del); }
.flow { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.3rem; }
.flow li { display: grid; grid-template-columns: 1.2rem minmax(0, 1fr); gap: 0.5rem; padding: 0.4rem 0.6rem; background: var(--sunk); border-radius: 6px; font-size: 0.9375rem; }
.flow .ok b { color: var(--rec); } .flow .fail b { color: var(--bad); } .flow .stuck b { color: var(--warn); } .flow .now b { color: var(--accent); }
.pnote { margin: 0.5rem 0 0; font-size: 0.9375rem; color: var(--muted); }
.nums { width: 100%; border-collapse: collapse; font-size: 0.9375rem; font-variant-numeric: tabular-nums; }
.nums th { text-align: left; font-weight: 400; color: var(--muted); padding: 0.35rem 0; } .nums td { text-align: right; font-weight: 700; padding: 0.35rem 0; }
.nums tr + tr > * { border-top: 1px solid var(--line); } .nums .bad { color: var(--bad); } .nums .good { color: var(--rec); }

.items { margin-top: 1rem; border-top: 1px solid var(--line); } .items details { border-bottom: 1px solid var(--line); } .items summary { padding: 0.55rem 0; cursor: pointer; }
.note { margin: 1rem 0 0; max-width: 40rem; } .note label { display: block; font-weight: 700; margin-bottom: 0.25rem; }
textarea { width: 100%; min-height: 4rem; padding: 0.5rem 0.65rem; border: 2px solid var(--line); border-radius: 7px; background: var(--card); }
.foot { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 1.5rem; padding-block: 0.75rem; }
.unsure[aria-pressed="true"] { font-weight: 700; text-decoration: none; background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding-inline: 0.7rem; }
.btn { border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 0.7rem 1.35rem; cursor: pointer; }
.btn:disabled { background: var(--sunk); color: var(--muted); cursor: not-allowed; }
.foot .btn { margin-left: auto; } .kbd { font: 0.8125rem var(--m); opacity: 0.85; margin-left: 0.5rem; }

.rows { border-top: 1px solid var(--line); margin: 1.1rem 0 1.25rem; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.1rem 1rem; padding: 0.7rem 0; border-bottom: 1px solid var(--line); align-items: start; }
.row .q { color: var(--muted); font-size: 0.9375rem; } .row .a { font-weight: 700; grid-column: 1; } .row .n { grid-column: 1; color: var(--muted); }
.row .link { grid-column: 2; grid-row: 1 / span 2; } .row .skip { color: var(--muted); font-weight: 400; }
.tag { display: inline-block; font-size: 0.8125rem; font-weight: 700; border-radius: 4px; padding: 0.05rem 0.45rem; margin-left: 0.5rem; background: var(--warn-bg); color: var(--warn); }
.check { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr); gap: 0.25rem 1rem; padding: 0.8rem 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.check.two { grid-template-columns: 1.6rem minmax(0, 1fr) minmax(0, 1fr); }
.check input { width: 1.3rem; height: 1.3rem; margin: 0.1rem 0 0; accent-color: var(--accent); } .check b { display: block; }
pre { background: var(--sunk); border-radius: 7px; padding: 0.8rem; font: 0.8125rem/1.5 var(--m); white-space: pre-wrap; overflow-wrap: anywhere; margin: 0.5rem 0 0; }
.status { color: var(--rec); font-weight: 700; margin: 0.6rem 0 0; } .status:empty { margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; align-items: center; }

@media (max-width: 46rem) {
  .options { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; gap: 0.9rem; } .opt { grid-row: auto; grid-template-rows: none; }
  .check.two { grid-template-columns: 1.6rem minmax(0, 1fr); } .check .after { grid-column: 2; } .kbd, .bar { display: none; }
}
</style>
