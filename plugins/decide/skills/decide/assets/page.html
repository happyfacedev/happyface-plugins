  --orange: #b94a00; --blue: #1f4fd1; --rose: #bd1f5b; --teal: #00736a; --violet: #6a30c4;
  --orange-t: #fdeadb; --blue-t: #e2eafd; --rose-t: #fce3ec; --teal-t: #d8f2ee; --violet-t: #ece3fb;
  --orange-i: #9a3d00; --blue-i: #1f4fd1; --rose-i: #a81850; --teal-i: #006158; --violet-i: #5b25ad;
  --warn: #8f4a00; --warn-bg: #fdeed8;

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0d1117; --card: #131922; --sunk: #1b222d; --ink: #eef1f5; --muted: #a9b3c1; --line: #394452; --focus: #ffbf47; --orange-t: #3a2212; --blue-t: #17264f; --rose-t: #431a2c; --teal-t: #0c3531; --violet-t: #2d1f4d; --orange-i: #ffae70; --blue-i: #9db7ff; --rose-i: #ff9dc0; --teal-i: #62dccd; --violet-i: #c9aaff; --warn: #f3ad5b; --warn-bg: #38280f; --term-bg: #070a0f; --add-bg: #0c3531; --add: #62dccd; --del-bg: #431a2c; --del: #ff9dc0; --hi-bg: #3d3412; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #0d1117; --card: #131922; --sunk: #1b222d; --ink: #eef1f5; --muted: #a9b3c1; --line: #394452; --focus: #ffbf47; --orange-t: #3a2212; --blue-t: #17264f; --rose-t: #431a2c; --teal-t: #0c3531; --violet-t: #2d1f4d; --orange-i: #ffae70; --blue-i: #9db7ff; --rose-i: #ff9dc0; --teal-i: #62dccd; --violet-i: #c9aaff; --warn: #f3ad5b; --warn-bg: #38280f; --term-bg: #070a0f; --add-bg: #0c3531; --add: #62dccd; --del-bg: #431a2c; --del: #ff9dc0; --hi-bg: #3d3412; color-scheme: dark }
.orange { --h: var(--orange); --t: var(--orange-t); --i: var(--orange-i); } .blue { --h: var(--blue); --t: var(--blue-t); --i: var(--blue-i); } .rose { --h: var(--rose); --t: var(--rose-t); --i: var(--rose-i); } .teal { --h: var(--teal); --t: var(--teal-t); --i: var(--teal-i); } .violet { --h: var(--violet); --t: var(--violet-t); --i: var(--violet-i); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 1rem/1.45 var(--f); }
button, textarea { font: inherit; color: inherit; }
.app { min-height: 100%; max-width: 76rem; margin: 0 auto; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.link { background: none; border: 0; padding: 0.45rem 0; color: var(--i); cursor: pointer; text-decoration: underline; text-underline-offset: 0.2em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

.top { display: flex; align-items: center; gap: 1.1rem; min-height: 3.1rem; }
.theme { flex: none; width: 2.1rem; height: 2.1rem; padding: 0; border: 2px solid var(--line); border-radius: 50%; background: var(--card); color: var(--ink); display: grid; place-items: center; cursor: pointer; } .theme:hover { border-color: var(--muted); } .theme svg { width: 1.1rem; height: 1.1rem; display: block; }
.where { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { flex: 1; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 0.35rem; min-width: 0; }
.bar i { height: 8px; border-radius: 4px; background: var(--t); border: 1px solid var(--i); } .bar .seen { background: var(--h); border-color: var(--h); }

main { flex: 1; padding-bottom: 0.9rem; min-width: 0; }
main:focus { outline: none; }
.board { border-radius: 16px; overflow: hidden; background: var(--t); }
.tell { background: var(--h); color: var(--white); padding: 1.15rem 1.5rem 1.2rem; }
.body { padding: 1.15rem 1.25rem 1.25rem; }
h1 { font-size: clamp(1.5rem, 3.2vw, 2.1rem); line-height: 1.15; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.intro { margin: 0 0 0.5rem; max-width: 70ch; }
.why { margin: 0.4rem 0 0; font-size: 1.125rem; max-width: 65ch; }
.cap { margin: 0.3rem 0 0; font-size: 0.9375rem; }

.opt { position: relative; display: grid; grid-row: span 4; grid-template-rows: subgrid; min-width: 0; border: 3px solid transparent; border-radius: 13px; background: var(--card); cursor: pointer; overflow: hidden; }
.opt:hover { border-color: var(--i); }
.opt:has(input:checked) { border-color: var(--h); box-shadow: 0 0 0 3px var(--h); }
.opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 4px; }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.1rem 0.7rem; padding: 0.8rem 1rem 0.75rem; margin-bottom: 0.75rem; align-content: start; }
.opt:has(input:checked) .head { background: var(--h); color: var(--white); }
.key { grid-row: span 2; width: 2rem; height: 2rem; display: grid; place-items: center; border-radius: 8px; background: var(--h); color: var(--white); font: 500 1rem var(--m); }
.opt:has(input:checked) .key { background: var(--white); color: var(--h); }
.name { font-weight: 700; font-size: 1.1875rem; line-height: 1.25; }
.does { color: var(--muted); font-size: 0.9375rem; } .opt:has(input:checked) .does { color: var(--white); }
.pic { padding: 0 1rem 0.75rem; min-width: 0; }
.src { display: block; font-size: 0.8125rem; color: var(--muted); padding-top: 0.35rem; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.15rem 0.75rem; margin: 0; padding: 0.65rem 1rem; border-top: 1px solid var(--line); font-size: 0.9375rem; align-content: start; }
.facts.none:empty { padding: 0; border: 0; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; font-weight: 700; }
.facts .perm { grid-column: 1 / -1; background: var(--rose); color: var(--white); border-radius: 6px; padding: 0.2rem 0.55rem; margin-top: 0.3rem; }
.rec { font-size: 0.9375rem; } .rec.on { padding: 0.6rem 1rem; background: var(--teal); color: var(--white); }

.term, .file { border-radius: 8px; font: 0.8125rem/1.55 var(--m); overflow-x: auto; }
.term { background: var(--term-bg); color: var(--term-ink); padding: 0.65rem 0.75rem; }
.ln { white-space: pre-wrap; overflow-wrap: anywhere; padding-inline: 0.3rem; border-radius: 3px; }
.term .cmd { color: var(--term-cmd); } .term .err { color: var(--term-err); } .term .muted, .term .exit { color: var(--term-muted); } .term .hi { background: var(--term-hi); color: var(--term-hi-ink); }
.term .exit { padding: 0.35rem 0.3rem 0; font-size: 0.75rem; } .term .exit.bad { color: var(--term-err); }
.file { border: 1px solid var(--line); background: var(--card); }
.fname { background: var(--sunk); color: var(--muted); padding: 0.3rem 0.65rem; font-size: 0.75rem; overflow-wrap: anywhere; }
.file .body { padding: 0.35rem; } .file .muted { color: var(--muted); } .file .hi { background: var(--hi-bg); }
.file .add { background: var(--add-bg); color: var(--add); } .file .del { background: var(--del-bg); color: var(--del); }
.flow { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.35rem; }
.flow li { display: grid; grid-template-columns: 1.2rem minmax(0, 1fr); gap: 0.5rem; padding: 0.45rem 0.65rem; background: var(--t); border-radius: 7px; font-size: 0.9375rem; }
.flow .ok b { color: var(--teal-i); } .flow .fail b { color: var(--rose-i); } .flow .stuck b { color: var(--orange-i); } .flow .now { background: var(--h); color: var(--white); }
.pnote { margin: 0.5rem 0 0; font-size: 0.9375rem; color: var(--muted); }
.nums { width: 100%; border-collapse: collapse; font-size: 0.9375rem; font-variant-numeric: tabular-nums; }
.nums th { text-align: left; font-weight: 400; color: var(--muted); padding: 0.3rem 0; } .nums td { text-align: right; font-weight: 700; font-size: 1.25rem; padding: 0.3rem 0; }
.nums tr + tr > * { border-top: 1px solid var(--line); } .nums .bad { color: var(--rose-i); } .nums .good { color: var(--teal-i); }

.items { margin-top: 1rem; background: var(--card); border-radius: 11px; padding: 0.2rem 1rem; } .items details + details { border-top: 1px solid var(--line); } .items summary { padding: 0.55rem 0; cursor: pointer; }
.note { margin: 1rem 0 0; max-width: 44rem; } .note label { display: block; font-weight: 700; margin-bottom: 0.25rem; }
textarea { width: 100%; min-height: 4rem; padding: 0.5rem 0.65rem; border: 2px solid var(--i); border-radius: 8px; background: var(--card); }
.foot { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 1.5rem; padding-block: 0.65rem; }
.unsure[aria-pressed="true"] { font-weight: 700; text-decoration: none; background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding-inline: 0.7rem; }
.btn { border: 0; border-radius: 9px; background: var(--h); color: var(--white); font-weight: 700; padding: 0.7rem 1.4rem; cursor: pointer; }
.btn:disabled { background: var(--sunk); color: var(--muted); cursor: not-allowed; }
.foot .btn { margin-left: auto; } .kbd { font: 0.8125rem var(--m); margin-left: 0.5rem; }

.rows { display: grid; gap: 0.5rem; margin: 0 0 1.1rem; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.1rem 1rem; padding: 0.6rem 0.9rem; background: var(--card); border-radius: 10px; border-left: 8px solid var(--h); align-items: start; }
.row .q { color: var(--muted); font-size: 0.9375rem; } .row .a { font-weight: 700; grid-column: 1; } .row .n { grid-column: 1; color: var(--muted); }
.row .link { grid-column: 2; grid-row: 1 / span 2; } .row .skip { color: var(--muted); font-weight: 400; }
.tag { display: inline-block; font-size: 0.8125rem; font-weight: 700; border-radius: 4px; padding: 0.05rem 0.45rem; margin-left: 0.5rem; background: var(--warn-bg); color: var(--warn); } .tag.perm { background: var(--rose); color: var(--white); }
.check { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr); gap: 0.25rem 1rem; padding: 0.8rem 0.95rem; background: var(--card); border-radius: 10px; cursor: pointer; border: 3px solid transparent; }
.check:has(input:checked) { border-color: var(--h); }
.check.two { grid-template-columns: 1.6rem minmax(0, 1fr) minmax(0, 1fr); }
.check input { width: 1.4rem; height: 1.4rem; margin: 0.1rem 0 0; accent-color: var(--h); } .check b { display: block; }
pre { background: var(--card); border-radius: 8px; padding: 0.8rem; font: 0.8125rem/1.5 var(--m); white-space: pre-wrap; overflow-wrap: anywhere; margin: 0.5rem 0 0; }
.status { color: var(--teal-i); font-weight: 700; margin: 0.6rem 0 0; } .status:empty { margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; align-items: center; }

@media (max-width: 46rem) {
  .options { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; gap: 0.9rem; } .opt { grid-row: auto; grid-template-rows: none; }
  .check.two { grid-template-columns: 1.6rem minmax(0, 1fr); } .check .after { grid-column: 2; } .kbd { display: none; }
  .tell { padding: 1rem 1.1rem; } .body { padding: 0.9rem; }
}
</style>

<script>
// Light or dark follows the system (or the host page) until the button overrides it; switching back to match follows again.
(() => {
  const root = document.documentElement, host = root.getAttribute("data-theme"), dark = matchMedia("(prefers-color-scheme: dark)"), KEY = "happyface-theme", b = document.getElementById("theme");
  const base = () => host || (dark.matches ? "dark" : "light"), now = () => root.getAttribute("data-theme") || base();
  const paint = () => { const to = now() === "dark" ? "light" : "dark"; b.setAttribute("aria-label", "Switch to " + to + " mode"); b.title = "Switch to " + to + " mode"; b.innerHTML = to === "light" ? '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>' : '<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M20.5 14.2A8.6 8.6 0 0 1 9.8 3.5a8.7 8.7 0 1 0 10.7 10.7z"/></svg>'; };
  try { const t = localStorage.getItem(KEY); if (t === "light" || t === "dark") root.setAttribute("data-theme", t); } catch (e) {}
  b.addEventListener("click", () => {
    const to = now() === "dark" ? "light" : "dark", follow = to === base();
    if (!follow) root.setAttribute("data-theme", to); else if (host) root.setAttribute("data-theme", host); else root.removeAttribute("data-theme");
    try { if (follow) localStorage.removeItem(KEY); else localStorage.setItem(KEY, to); } catch (e) {}
    paint();
  });
  dark.addEventListener("change", paint);
  paint();
})();
</script>
